<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tela de Login Responsiva</title>
  <link rel="stylesheet" href="estilos/style.css" media="all">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>
  <main id="container">
    <div id="foto"></div>

    <section id="itens">
      <h2>Login</h2>
      <p>Seja bem-vindo(a)</p>

      <form action="" method="post" autocomplete="on">
        <p>
          <span class="material-symbols-outlined">Person</span>
          <label for="iemail"></label>
          <input type="email" name="email" id="iemail" placeholder="E-mail" required />
        </p>

        <p>
          <span class="material-symbols-outlined">vpn_key</span>
          <label for="isenha"></label>
          <input type="password" name="senha" id="isenha" placeholder="Senha" required minlenght="8" maxlenght                     ="16" />
        </p>

        <p>
          <input type="submit" id="entrar" value="Entrar">
        </p>
        
        <p>
          <a href="#" id="esqueci">Esqueci a senha</a>
        </p>
      </form>
    </section>
  </main>
</body>

</html>
